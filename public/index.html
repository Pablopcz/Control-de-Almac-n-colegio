<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Control de Almacén</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome para los iconos (el ojito) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-login {
      /* 🎨 AQUÍ CAMBIAS EL COLOR DE FONDO DE LA TARJETA */
      background-color: #ebf8ff; /* Puedes usar otro color, ej: #f7fafc para gris suave */
      
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      border: 1px solid #bee3f8; /* Borde sutil a juego */
    }
    h2 {
      color: #1a365d;
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
    }
    .campo {
      margin-bottom: 20px;
    }
    label {
      font-size: 0.9em;
      font-weight: 600;
      color: #4a5568;
      display: block;
      margin-bottom: 8px;
    }
    input {
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      width: 100%;
      font-size: 1rem;
      background-color: #ffffff; /* Fondo interno de los inputs en blanco para destacar */
      transition: all 0.3s ease;
    }
    input:focus {
      border-color: #2b6cb0;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
      outline: none;
      background-color: #fff;
    }
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #2c5282;
    }
    .error {
      color: #e53e3e;
      font-size: 0.85em;
      text-align: center;
      margin-top: 15px;
      display: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card-login">
    <h2>Control de Almacén</h2>
    
    <div class="campo">
      <label for="usuario">Usuario / Código / Cédula:</label>
      <input type="text" id="usuario" placeholder="Ej: admin o 123456789" autocomplete="off">
    </div>

    <div class="campo">
      <label for="password">Contraseña:</label>
      <div class="input-group">
        <input type="password" id="password" class="form-control m-0" placeholder="••••••••" style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
        <button class="btn btn-outline-secondary m-0" type="button" id="toggle-password" onclick="togglePasswordVisibility()" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border: 1px solid #cbd5e0; background: #fff; color: #4a5568; width: 50px;">
          <i class="fa-solid fa-eye" id="eye-icon"></i>
        </button>
      </div>
    </div>

    <!-- Enlace de Olvidé mi contraseña -->
    <div class="text-end mb-3">
      <a href="#" onclick="olvidePassword(event)" style="font-size: 0.85em; color: #2b6cb0; text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="button" id="btn-ingresar" onclick="procesarIngreso(event)">Ingresar al Sistema</button>
    <div id="mensaje-error" class="error"></div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function olvidePassword(e) {
      e.preventDefault();
      alert("Por favor comunícate con el Administrador principal del sistema para realizar el restablecimiento de tu contraseña.");
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        procesarIngreso(e);
      }
    });

    async function procesarIngreso(e) {
      if (e) e.preventDefault();

      const usuarioInput = document.getElementById('usuario').value.trim();
      const passwordInput = document.getElementById('password').value;
      const errorDiv = document.getElementById('mensaje-error');

      errorDiv.style.display = 'none';

      if (!usuarioInput || !passwordInput) {
        errorDiv.textContent = 'Por favor completa todos los campos.';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/usuarios/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuarioInput, password: passwordInput })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('usuarioSesion', JSON.stringify(data.usuario));
          
          const rol = (data.usuario.rol || '').toLowerCase();

          if (rol === 'admin' || rol === 'administrador') {
            window.location.replace('/admin.html');
          } else if (rol === 'docente') {
            window.location.replace('/docente.html');
          } else {
            errorDiv.textContent = 'Rol no asignado o no reconocido.';
            errorDiv.style.display = 'block';
          }
        } else {
          errorDiv.textContent = data.mensaje || 'Credenciales incorrectas';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        console.error('Error al conectar:', err);
        errorDiv.textContent = 'No se pudo conectar con el servidor backend.';
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
